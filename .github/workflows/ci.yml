name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The built plugin (plugin/app, plugin.json version) is committed, because the plugin cache
      # only gets what is in the repository. The build is deterministic, so it must match.
      - name: Committed build is up to date
        run: |
          git status --porcelain -- plugin
          test -z "$(git status --porcelain -- plugin)" || { echo "::error::plugin/ differs from a fresh build: run pnpm build and commit plugin/"; git diff --stat -- plugin; exit 1; }
