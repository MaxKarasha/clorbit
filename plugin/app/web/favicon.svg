<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="62%" cy="30%" r="85%">
      <stop offset="0" stop-color="#2a1d5c"/>
      <stop offset=".45" stop-color="#0d1236"/>
      <stop offset="1" stop-color="#03040a"/>
    </radialGradient>
    <radialGradient id="neb" cx="22%" cy="85%" r="55%">
      <stop offset="0" stop-color="#1f5d8f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#1f5d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9fe0ff" stop-opacity=".75"/>
      <stop offset=".5" stop-color="#5cc8ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="42%" cy="38%" r="62%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#d9f3ff"/>
      <stop offset=".75" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#2f7fd6"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset=".55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#ff6fb0"/>
    </linearGradient>
    <radialGradient id="planet" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#e4dbff"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6a4fd6"/>
    </radialGradient>
    <clipPath id="front"><rect x="0" y="32" width="64" height="32"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#neb)"/>
  <rect x=".75" y=".75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#96b4f5" stroke-opacity=".22" stroke-width="1.2"/>

  <!-- distant stars -->
  <circle cx="12" cy="13" r="1.1" fill="#fff" opacity=".85"/>
  <circle cx="51" cy="51" r=".9" fill="#fff" opacity=".6"/>
  <circle cx="9" cy="44" r=".7" fill="#cfe6ff" opacity=".5"/>
  <circle cx="44" cy="9" r=".7" fill="#fff" opacity=".55"/>

  <!-- back half of the orbit -->
  <g transform="rotate(-24 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="9.5" fill="none" stroke="url(#ring)" stroke-width="2.6" opacity=".55"/>
  </g>

  <!-- the star -->
  <circle cx="32" cy="32" r="21" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="12.5" fill="url(#core)"/>

  <!-- front half of the orbit, over the star -->
  <g transform="rotate(-24 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="9.5" fill="none" stroke="url(#ring)" stroke-width="3.4" clip-path="url(#front)"/>
    <!-- planet on the front arc -->
    <circle cx="51.1" cy="38.7" r="4.6" fill="url(#planet)" stroke="#0d1236" stroke-width="1.2"/>
  </g>
</svg>
